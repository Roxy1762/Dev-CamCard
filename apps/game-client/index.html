<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dev-CamCard · 课表风暴</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #0f0f1e;
        color: #f5f5fa;
        /* 中文优先字体栈：默认 sans-serif 在 Windows / Android 上会回退到非常细
           的位图字体，可读性差；优先使用平台中文字体。 */
        font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
          "Source Han Sans SC", "Noto Sans CJK SC", "Helvetica Neue", system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }
      body {
        line-height: 1.4;
      }
      #lobby {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 32px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-height: 100vh;
        overflow-y: auto;
      }
      #lobby header h1 {
        font-size: 28px;
        letter-spacing: 0.05em;
      }
      #lobby header p {
        margin-top: 8px;
        color: #9b9bbf;
        font-size: 14px;
        line-height: 1.6;
      }
      .panel {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .panel h2 {
        font-size: 16px;
        color: #c0c0e6;
        font-weight: 600;
      }
      .panel-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      input[type="text"] {
        flex: 1 1 180px;
        padding: 10px 12px;
        font-size: 14px;
        background: #1c1c33;
        color: #f5f5fa;
        border: 1px solid #2c2c4a;
        border-radius: 8px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: #5b8cff;
      }
      button {
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #3a5cff;
        color: #fff;
        transition: filter 0.15s ease, transform 0.05s ease;
        font-family: inherit;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.1);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.secondary {
        background: #2c2c4a;
        color: #d8d8ee;
      }
      .status {
        font-size: 13px;
        color: #9b9bbf;
        min-height: 18px;
        line-height: 1.6;
      }
      .status.error {
        color: #ff6b7a;
        white-space: pre-line;
      }
      .footer-links {
        margin-top: auto;
        padding-top: 24px;
        font-size: 12px;
        color: #6f6f9a;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .footer-links a {
        color: #8aa8ff;
        text-decoration: none;
      }
      .footer-links a:hover {
        text-decoration: underline;
      }
      .room-id-display {
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-size: 16px;
        color: #ffd86b;
        letter-spacing: 0.08em;
        background: #1c1c33;
        padding: 8px 12px;
        border-radius: 6px;
        display: inline-block;
        user-select: all;
      }
      button.copy-btn {
        background: #2c2c4a;
        color: #ffd86b;
        padding: 8px 12px;
        font-size: 13px;
      }
      button.copy-btn.copied {
        background: #224433;
        color: #aaffcc;
      }
      .hidden {
        display: none !important;
      }

      /* ═══════════════════════════════════════════════════════════════════════
         游戏界面（HTML 版） — 替换原 Phaser RoomScene。

         设计要点：
         1. CSS Grid 自动布局 → 永远不会出现 y 坐标重叠
         2. 浏览器原生字体渲染 → 高 DPI / 任意缩放都清晰
         3. 各分区独立可滚动 → 内容多了不会撑爆视口或被裁掉
         4. 响应式断点 → 手机 / 平板 / 桌面均可读
         ═══════════════════════════════════════════════════════════════════ */

      #game-view {
        display: flex;
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        padding: 8px;
        gap: 8px;
        overflow: hidden;
      }

      /* ── 顶部信息栏 ──────────────────────────────────────────────────── */
      .game-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        flex-shrink: 0;
      }
      .game-header .room-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #ffd86b;
      }
      .game-header .room-pill .label {
        opacity: 0.7;
      }
      .game-header .room-pill .room-id {
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-weight: 600;
        letter-spacing: 0.08em;
        user-select: all;
      }
      .game-header .room-pill button {
        padding: 4px 10px;
        font-size: 12px;
        background: #2c2c4a;
        color: #ffd86b;
        border: 1px solid rgba(255, 216, 107, 0.35);
        border-radius: 6px;
      }
      .game-header .room-pill button.copied {
        background: #1f3a26;
        color: #aaffcc;
        border-color: rgba(170, 255, 204, 0.45);
      }
      .game-header .turn-status {
        flex: 1;
        text-align: center;
        font-size: 15px;
        color: #cccccc;
      }
      .game-header .turn-status.my-turn {
        color: #88ff88;
        font-weight: 600;
      }
      .game-header .header-btn {
        padding: 6px 12px;
        font-size: 12px;
        background: #22334a;
        color: #cccccc;
        border-radius: 6px;
      }
      .game-header .header-btn.preview-off {
        background: #332233;
      }

      .error-banner {
        padding: 8px 14px;
        background: #441111;
        color: #ffaaaa;
        border-radius: 8px;
        font-size: 13px;
        flex-shrink: 0;
      }

      /* ── 主区：玩家信息 + 商店两栏 ─────────────────────────────────── */
      .game-main {
        display: grid;
        grid-template-columns: minmax(280px, 1.1fr) minmax(320px, 1fr);
        gap: 8px;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }
      .players-col,
      .market-col {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        min-height: 0;
      }

      /* ── 玩家卡片 ────────────────────────────────────────────────── */
      .player-card {
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .player-card.me {
        border-color: rgba(102, 204, 255, 0.3);
        background: rgba(102, 204, 255, 0.05);
      }
      .player-card .pc-header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 14px;
        color: #66ccff;
        font-weight: 600;
      }
      .player-card .pc-header .role {
        letter-spacing: 0.04em;
      }
      .player-card .pc-header .name {
        color: #f5f5fa;
        font-weight: 500;
      }
      .player-card .vitals,
      .player-card .resources {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 12.5px;
      }
      .player-card .vitals .v {
        color: #88ff88;
      }
      .player-card .resources .v {
        color: #88ccff;
      }
      .player-card .vitals .v .label,
      .player-card .resources .v .label {
        opacity: 0.65;
        margin-right: 3px;
      }
      .player-card .venues,
      .player-card .schedule,
      .player-card .reserved {
        font-size: 12.5px;
        color: #aaaaaa;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .player-card .venues .venue {
        padding: 4px 8px;
        background: #553388;
        color: #ffffff;
        border-radius: 5px;
        font-size: 11.5px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .player-card .venues .venue.guard {
        background: #880022;
      }
      .player-card .venues .venue button {
        padding: 2px 8px;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.3);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 4px;
      }
      .player-card .schedule .slot {
        padding: 2px 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        color: #cccccc;
      }
      .player-card .schedule .slot.empty {
        color: #555555;
      }
      .player-card .reserved.has {
        color: #aaffaa;
      }
      .player-card .reserved button {
        padding: 3px 9px;
        font-size: 11px;
        background: #224433;
        color: #aaffcc;
        border: 1px solid rgba(170, 255, 204, 0.35);
        border-radius: 4px;
        margin-left: 6px;
      }
      .player-card .discard-warn {
        font-size: 12px;
        color: #ffcc44;
      }
      .player-card .guard-hint {
        font-size: 11.5px;
        color: #ff9999;
      }

      /* ── 商店 ────────────────────────────────────────────────────── */
      .market-col {
        padding: 10px;
        background: rgba(85, 51, 136, 0.06);
        border: 1px solid rgba(85, 51, 136, 0.25);
        border-radius: 8px;
      }
      .market-col h2,
      .market-col h3 {
        font-size: 14px;
        color: #cc88ff;
        font-weight: 600;
        margin-top: 4px;
      }
      .market-col h3 {
        font-size: 12.5px;
        opacity: 0.85;
      }
      .market-lanes {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
      }
      .lane {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .lane .lane-title {
        font-size: 11px;
        color: #cc88ff;
        letter-spacing: 0.08em;
        font-weight: 600;
      }
      .market-card,
      .fixed-card {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 6px;
        background: #1c1c33;
        border: 1px solid #2c2c4a;
        border-radius: 5px;
        font-size: 12px;
        min-height: 38px;
      }
      .market-card.empty {
        color: #555555;
        opacity: 0.55;
        text-align: center;
        font-size: 11px;
      }
      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 6px;
      }
      .market-card .name {
        color: #f5f5fa;
        font-weight: 500;
      }
      /* ── 价签 ───────────────────────────────────────────────────── */
      .cost-badge {
        flex-shrink: 0;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        color: #ffe9b0;
        background: #4a3a12;
        border: 1px solid #6b5316;
      }
      .cost-badge.rarity-uncommon {
        color: #c9e8ff;
        background: #143047;
        border-color: #2b5e84;
      }
      .cost-badge.rarity-rare {
        color: #ffd9ff;
        background: #3a1442;
        border-color: #743089;
      }
      .market-card.unaffordable,
      .fixed-card.unaffordable {
        opacity: 0.55;
      }
      .market-card.unaffordable .cost-badge,
      .fixed-card.unaffordable .cost-badge {
        color: #ff9a9a;
        background: #3a1414;
        border-color: #6b1f1f;
      }
      .actions button:disabled,
      .reserved button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .market-card .preview {
        font-size: 10.5px;
        color: #9aaecc;
        line-height: 1.35;
        max-height: 60px;
        overflow: auto;
      }
      .market-card .actions {
        display: flex;
        gap: 4px;
        margin-top: 2px;
      }
      .market-card .actions button {
        flex: 1;
        padding: 4px 6px;
        font-size: 11px;
      }
      .market-card .actions .buy-btn {
        background: #003355;
        color: #ffffff;
      }
      .market-card .actions .reserve-btn {
        background: #224433;
        color: #aaffcc;
      }
      .fixed-supplies {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .fixed-card .name {
        color: #f5f5fa;
      }
      .fixed-card .preview {
        font-size: 10.5px;
        color: #9aaecc;
        line-height: 1.35;
      }
      .fixed-card .actions {
        display: flex;
        gap: 4px;
      }
      .fixed-card .actions .buy-btn {
        flex: 1;
        padding: 5px 8px;
        font-size: 11.5px;
        background: #003355;
        color: #ffffff;
      }

      /* ── 手牌区 ─────────────────────────────────────────────────── */
      .hand-area {
        flex-shrink: 0;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
      }
      .hand-area .hand-title {
        font-size: 13px;
        color: #aaaaaa;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .hand-area .hand-title .conditions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .hand-area .hand-title .cond {
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.05);
        color: #555577;
        border: 1px solid rgba(255, 255, 255, 0.08);
        letter-spacing: 0.04em;
      }
      .hand-area .hand-title .cond.active {
        background: #1f3a26;
        color: #aaffcc;
        border-color: rgba(170, 255, 204, 0.4);
      }
      .hand-area .hand-title .cond.active.guard {
        background: #3a1f26;
        color: #ffaacc;
        border-color: rgba(255, 170, 204, 0.4);
      }
      /* hover-ref：悬浮一张带 condition 的卡牌时，对应 chip 被点亮 */
      .hand-area .hand-title .cond.hover-ref {
        box-shadow: 0 0 0 2px rgba(120, 180, 255, 0.55);
        transform: translateY(-1px);
        transition: box-shadow 100ms ease, transform 100ms ease;
      }
      .hand-area .hand-title .cond.hover-ref-unmet {
        background: #4a1c24;
        color: #ffb0bb;
        border-color: rgba(255, 120, 140, 0.6);
        box-shadow: 0 0 0 2px rgba(255, 110, 130, 0.55);
      }
      .hand-card.has-cond {
        cursor: help;
      }
      .hand-cards {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .hand-card {
        flex: 0 0 130px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px;
        background: #003355;
        border: 1px solid rgba(102, 204, 255, 0.3);
        border-radius: 6px;
        font-size: 12px;
        color: #ffffff;
      }
      .hand-card.status {
        background: #332222;
        border-color: rgba(170, 102, 102, 0.4);
        color: #aa6666;
      }
      .hand-card.opp-style {
        background: #222244;
        color: #aaaaaa;
      }
      .hand-card .name {
        font-weight: 600;
        text-align: center;
        font-size: 12.5px;
      }
      .hand-card .actions {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .hand-card button {
        padding: 5px 6px;
        font-size: 11px;
        background: #1f3a4a;
        color: #ffffff;
        border-radius: 4px;
      }
      .hand-card button.schedule-btn {
        background: #223300;
        color: #ddffaa;
      }
      .hand-card .hint {
        font-size: 10.5px;
        color: #ffaa88;
        text-align: center;
      }

      /* ── 操作按钮区 ─────────────────────────────────────────────── */
      .action-bar {
        flex-shrink: 0;
        display: flex;
        gap: 8px;
        padding: 6px 0;
      }
      .action-bar button {
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
      }
      .action-bar .ready-btn {
        background: #004422;
        color: #aaffaa;
      }
      .action-bar .end-turn-btn {
        background: #225522;
        color: #aaffaa;
      }
      .action-bar .attack-btn {
        background: #663322;
        color: #ffaaaa;
      }
      .action-bar .concede-btn {
        background: #441111;
        color: #ffaaaa;
        margin-left: auto;
      }
      .action-bar .guard-warn {
        align-self: center;
        color: #ffaaaa;
        font-size: 12px;
      }
      .action-bar .turn-hint {
        align-self: center;
        color: #666688;
        font-size: 12px;
      }

      /* ── 事件日志 ───────────────────────────────────────────────── */
      .event-log {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 8px;
        font-size: 11.5px;
        min-height: 36px;
      }
      .event-log .label {
        color: #555577;
      }
      .event-log .events {
        display: flex;
        gap: 12px;
        flex: 1;
        overflow-x: auto;
        color: #667788;
      }
      .event-log .replay-btn {
        padding: 6px 12px;
        font-size: 12px;
        background: #222233;
        color: #6688aa;
        border: 1px solid rgba(102, 136, 170, 0.3);
        border-radius: 5px;
      }

      /* ── 模态弹层（设置 / 选择 / 回放 / 结束） ──────────────────── */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 16px;
      }
      .modal-card {
        background: #14142a;
        border: 1px solid #4a4a7a;
        border-radius: 10px;
        padding: 18px;
        min-width: 280px;
        max-width: 720px;
        max-height: 90vh;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .modal-card.large {
        min-width: min(640px, 90vw);
      }
      /* ── 新手教程模态 ───────────────────────────────────────────── */
      .modal-card.tutorial-card {
        min-width: min(460px, 92vw);
        max-width: 520px;
      }
      .tutorial-dots {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .tutorial-dots .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #3a3a5e;
        transition: background 0.15s, transform 0.15s;
      }
      .tutorial-dots .dot.active {
        background: #ffd86b;
        transform: scale(1.25);
      }
      .tutorial-body {
        font-size: 13.5px;
        line-height: 1.6;
        color: #d4d8ea;
        max-height: 52vh;
        overflow: auto;
      }
      .tutorial-body p {
        margin: 0 0 8px;
        white-space: pre-wrap;
      }
      .tutorial-body p.spacer {
        margin: 0;
        height: 4px;
      }
      .tutorial-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .tutorial-nav button {
        padding: 7px 16px;
        font-size: 13px;
        border-radius: 6px;
      }
      .tutorial-nav button.primary {
        background: #2a5a2a;
        color: #ddffdd;
      }
      .tutorial-nav button.secondary {
        background: #222244;
        color: #cccccc;
      }
      .tutorial-nav button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .tutorial-progress {
        font-size: 12px;
        color: #9aaecc;
      }
      .tutorial-skip {
        align-self: center;
        background: none;
        border: none;
        color: #7a7a9a;
        font-size: 12px;
        text-decoration: underline;
        cursor: pointer;
      }
      .modal-card h3 {
        color: #ffd86b;
        font-size: 16px;
      }
      .modal-card .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #cccccc;
        cursor: pointer;
      }
      .modal-card .modal-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .modal-card button.close-btn {
        background: #222244;
        color: #cccccc;
        align-self: flex-end;
      }
      .modal-card .candidates {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-height: 50vh;
        overflow: auto;
      }
      .modal-card .candidate {
        flex: 0 0 130px;
        padding: 8px;
        background: #222244;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 5px;
        color: #cccccc;
        font-size: 12px;
        cursor: pointer;
        text-align: center;
      }
      .modal-card .candidate.selected {
        background: #226622;
        color: #aaffaa;
        border-color: #88cc88;
      }
      .modal-card .candidate.selected.target {
        background: #662222;
        color: #ffaaaa;
        border-color: #cc8888;
      }
      .modal-card .candidate.player {
        flex: 0 0 160px;
        padding: 12px;
      }
      .modal-card .meta {
        font-size: 12px;
        color: #aaaaaa;
      }
      .modal-card .replay-table {
        font-family: ui-monospace, "JetBrains Mono", monospace;
        font-size: 11.5px;
        max-height: 50vh;
        overflow: auto;
      }
      .modal-card .replay-table .row {
        display: grid;
        grid-template-columns: 50px 80px 1fr 60px 2fr;
        gap: 6px;
        padding: 4px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .modal-card .replay-table .row.clickable {
        cursor: pointer;
      }
      .modal-card .replay-table .row.clickable:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .modal-card .replay-table .row.past {
        opacity: 0.55;
      }
      .modal-card .replay-table .row.current {
        background: rgba(80, 140, 255, 0.18);
        color: #ffffff;
        box-shadow: inset 3px 0 0 #5aa0ff;
        font-weight: 600;
        opacity: 1;
      }
      .modal-card .replay-table .head {
        color: #8888aa;
        font-weight: 600;
        position: sticky;
        top: 0;
        background: #1a1a24;
        z-index: 1;
      }
      .modal-card .replay-table .seq {
        color: #666688;
      }
      .modal-card .replay-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 8px;
      }
      .modal-card .replay-ctrl-btn {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        background: #2a2a36;
        color: #d0d0e0;
        border: 1px solid rgba(255, 255, 255, 0.08);
        cursor: pointer;
        transition: background 120ms ease, opacity 120ms ease;
      }
      .modal-card .replay-ctrl-btn:hover:not(:disabled) {
        background: #3a3a4c;
      }
      .modal-card .replay-ctrl-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .modal-card .replay-ctrl-btn.active {
        background: #5aa0ff;
        color: #0a0a14;
        border-color: #5aa0ff;
      }
      .modal-card .replay-speed-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      .modal-card .replay-speed-label {
        font-size: 11px;
        color: #888899;
        margin-right: 2px;
      }
      .modal-card .replay-progress {
        font-size: 12px;
        color: #aaaabb;
        margin-bottom: 4px;
        font-family: ui-monospace, "JetBrains Mono", monospace;
      }
      .modal-card .replay-progress-bar {
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .modal-card .replay-progress-bar .fill {
        height: 100%;
        background: linear-gradient(90deg, #5aa0ff, #b07aff);
        transition: width 160ms ease;
      }

      .end-banner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 24px 36px;
        font-size: 28px;
        font-weight: 700;
        background: rgba(0, 0, 0, 0.85);
        border-radius: 12px;
        z-index: 40;
      }
      .end-banner.win {
        color: #88ff88;
      }
      .end-banner.lose {
        color: #ff6666;
      }

      /* ── 卡牌悬浮预览 tooltip ──────────────────────────────────── */
      #g-card-tooltip {
        position: fixed;
        z-index: 80;
        max-width: 300px;
        padding: 10px 12px;
        background: #14142a;
        border: 1px solid rgba(255, 216, 107, 0.5);
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
        font-size: 12px;
        line-height: 1.45;
        color: #e8e8f5;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.12s ease;
      }
      #g-card-tooltip.visible {
        opacity: 1;
      }
      #g-card-tooltip .tip-title {
        font-size: 13px;
        font-weight: 600;
        color: #ffd86b;
        margin-bottom: 4px;
      }
      #g-card-tooltip .tip-body {
        white-space: pre-wrap;
        color: #c8c8e0;
      }
      #g-card-tooltip .tip-reminder {
        margin-top: 4px;
        font-style: italic;
        color: #8aa0c8;
      }
      #g-card-tooltip .tip-empty {
        color: #888888;
        font-style: italic;
      }

      /* ───────── 多屏适配 ───────── */

      @media (max-width: 540px) {
        #lobby {
          padding: 24px 14px 24px;
          gap: 16px;
        }
        #lobby header h1 {
          font-size: 22px;
        }
        #lobby header p {
          font-size: 13px;
        }
        .panel {
          padding: 14px;
          gap: 10px;
        }
        button {
          flex: 1 1 auto;
          padding: 10px 12px;
        }
        button.copy-btn {
          flex: 0 0 auto;
        }
        input[type="text"] {
          flex: 1 1 100%;
        }
        .room-id-display {
          font-size: 14px;
        }
        .footer-links {
          font-size: 11px;
          gap: 12px;
        }
      }

      /* 小屏：游戏区改为单列纵向滚动 */
      @media (max-width: 900px) {
        #game-view {
          padding: 6px;
          gap: 6px;
        }
        .game-header {
          padding: 6px 10px;
          font-size: 12px;
          flex-wrap: wrap;
        }
        .game-header .turn-status {
          flex-basis: 100%;
          order: 3;
        }
        .game-main {
          grid-template-columns: 1fr;
        }
        .market-lanes {
          grid-template-columns: 1fr;
        }
        .hand-card {
          flex: 0 0 110px;
          font-size: 11.5px;
        }
        .action-bar {
          flex-wrap: wrap;
        }
      }

      @media (min-width: 541px) and (max-width: 1023px) {
        #lobby {
          max-width: 640px;
          padding: 36px 20px;
        }
      }

      @media (min-width: 1440px) {
        #lobby {
          max-width: 820px;
        }
        #game-view {
          padding: 12px;
          gap: 12px;
        }
        .game-main {
          grid-template-columns: minmax(360px, 1fr) minmax(420px, 1.1fr);
        }
      }

      @media (max-height: 480px) and (orientation: landscape) {
        #lobby {
          padding: 16px 14px;
        }
        #lobby header h1 {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <header>
        <h1>Dev-CamCard · 课表风暴</h1>
        <p>1v1 卡牌对战原型。先取一个昵称，然后选择「快速匹配」「创建房间」或「输入房间号加入」。</p>
      </header>

      <section class="panel">
        <h2>玩家昵称</h2>
        <div class="panel-row">
          <input
            id="player-name"
            type="text"
            placeholder="例如：天天"
            maxlength="16"
            autocomplete="nickname"
          />
        </div>
      </section>

      <section class="panel">
        <h2>快速匹配</h2>
        <p class="status">直接被分配到任意有空位的房间，没有空位就开新房。</p>
        <div class="panel-row">
          <button id="quick-match" type="button">快速匹配</button>
        </div>
      </section>

      <section class="panel">
        <h2>和朋友开房</h2>
        <p class="status">点击创建后会拿到一个房间号，把它发给对方让对方加入。</p>
        <div class="panel-row">
          <button id="create-room" type="button">创建房间</button>
          <span id="created-room-id" class="room-id-display hidden"></span>
          <button id="copy-room-id" type="button" class="copy-btn hidden">📋 复制房号</button>
        </div>
        <div class="panel-row">
          <input
            id="join-room-id"
            type="text"
            placeholder="输入房间号加入..."
            autocapitalize="characters"
            autocomplete="off"
          />
          <button id="join-room" type="button" class="secondary">加入房间</button>
        </div>
      </section>

      <div id="lobby-status" class="status"></div>

      <div class="footer-links">
        <a id="admin-link" href="" target="_blank" rel="noopener">运营后台</a>
        <a href="/health" target="_blank" rel="noopener">服务健康检查</a>
        <a href="/api/matches" target="_blank" rel="noopener">对局 API</a>
        <a href="/api/cards" target="_blank" rel="noopener">卡牌 API</a>
      </div>
    </div>

    <div id="game-view" class="hidden">
      <header class="game-header">
        <div class="room-pill">
          <span class="label">房间</span>
          <span class="room-id" id="g-room-id"></span>
          <button id="g-room-copy" type="button" title="复制房号">📋 复制</button>
        </div>
        <div class="turn-status" id="g-turn-status">等待...</div>
        <button id="g-tutorial-toggle" type="button" class="header-btn">❔ 教程</button>
        <button id="g-settings-toggle" type="button" class="header-btn">⚙ 设置</button>
      </header>

      <div id="g-error" class="error-banner hidden"></div>

      <main class="game-main">
        <section class="players-col">
          <div id="g-opp" class="player-card opponent">
            <div class="pc-header">
              <span class="role">▌ 对方</span>
              <span class="tag"></span>
              <span class="name"></span>
            </div>
            <div class="vitals"></div>
            <div class="venues"></div>
            <div class="schedule"></div>
            <div class="reserved"></div>
          </div>

          <div id="g-me" class="player-card me">
            <div class="pc-header">
              <span class="role">▌ 我</span>
              <span class="tag"></span>
              <span class="name"></span>
            </div>
            <div class="vitals"></div>
            <div class="resources"></div>
            <div class="venues"></div>
            <div class="schedule"></div>
            <div class="reserved"></div>
            <div class="discard-warn"></div>
          </div>
        </section>

        <section class="market-col">
          <h2>【商店】</h2>
          <div id="g-market" class="market-lanes"></div>
          <h3>固定补给</h3>
          <div id="g-fixed-supplies" class="fixed-supplies"></div>
        </section>
      </main>

      <section class="hand-area">
        <div class="hand-title">
          <span>手牌（<span id="g-hand-count">0</span> 张）</span>
          <div id="g-conditions" class="conditions"></div>
        </div>
        <div id="g-hand" class="hand-cards"></div>
      </section>

      <footer class="action-bar" id="g-action-bar"></footer>

      <div class="event-log">
        <span class="label">近期事件</span>
        <div id="g-events" class="events"></div>
        <button id="g-replay-btn" type="button" class="replay-btn">查看回放</button>
      </div>

      <div id="g-settings-modal" class="modal hidden">
        <div class="modal-card">
          <h3>⚙ 设置</h3>
          <label class="toggle">
            <input type="checkbox" id="g-shop-preview" />
            <span>商店牌预览（显示卡牌效果文字）</span>
          </label>
          <button class="close-btn" id="g-settings-close" type="button">关闭</button>
        </div>
      </div>

      <div id="g-choice-modal" class="modal hidden">
        <div class="modal-card large">
          <h3 id="g-choice-title"></h3>
          <div id="g-choice-meta" class="meta"></div>
          <div id="g-choice-candidates" class="candidates"></div>
          <div id="g-choice-status" class="meta"></div>
          <div id="g-choice-actions" class="modal-actions"></div>
        </div>
      </div>

      <div id="g-replay-modal" class="modal hidden">
        <div class="modal-card large">
          <h3>对局回放（逐事件浏览器）</h3>
          <div id="g-replay-body"></div>
          <button class="close-btn" id="g-replay-close" type="button">关闭</button>
        </div>
      </div>

      <div id="g-tutorial-modal" class="modal hidden">
        <div class="modal-card tutorial-card">
          <div id="g-tutorial-dots" class="tutorial-dots"></div>
          <h3 id="g-tutorial-title"></h3>
          <div id="g-tutorial-body" class="tutorial-body"></div>
          <div class="tutorial-nav">
            <button id="g-tutorial-prev" type="button" class="secondary">上一步</button>
            <span id="g-tutorial-progress" class="tutorial-progress"></span>
            <button id="g-tutorial-next" type="button" class="primary">下一步 ▶</button>
          </div>
          <button id="g-tutorial-skip" type="button" class="tutorial-skip">跳过教程</button>
        </div>
      </div>

      <div id="g-end-banner" class="end-banner hidden"></div>
      <div id="g-card-tooltip" role="tooltip" aria-hidden="true"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
